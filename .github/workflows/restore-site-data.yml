name: Restore site data from verified backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-site-data.yml'

permissions:
  contents: write
  actions: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore site-data.json
        run: cp backups/site-data/site-data-20261029-152017-a2782cd.json site-data.json

      - name: Commit restored site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data.json
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Restore site data from verified backup"
            git push
          fi

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
