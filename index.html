const $=id=>document.getElementById(id);const L=v=>typeof v==='object'&&v?v[lang]||v.en||v.bn||Object.values(v)[0]||'':(v??'');
function txt(id,key){$(id).textContent=T[lang][key]||''}function money(n,cur){try{return new Intl.NumberFormat(lang==='bn'?'bn-BD':lang==='ar'?'ar':'en-US',{maximumFractionDigits:2}).format(n)+' '+cur}catch(e){return n.toFixed(2)+' '+cur}}
function countryName(c){if(!c)return'';const map={SA:['সৌদি আরব','Saudi Arabia','المملكة العربية السعودية','सऊदी अरब'],OM:['ওমান','Oman','عُمان','ओमान'],QA:['কাতার','Qatar','قطر','क़तर'],BH:['বাহরাইন','Bahrain','البحرين','बहरीन'],AE:['সংযুক্ত আরব আমিরাত','United Arab Emirates','الإمارات العربية المتحدة','संयुक्त अरब अमीरात'],MY:['মালয়েশিয়া','Malaysia','ماليزيا','मलेशिया'],KW:['কুয়েত','Kuwait','الكويت','कुवैत'],BD:['বাংলাদেশ','Bangladesh','بنغلاديش','बांग्लादेश']};return map[c.code]?.[['bn','en','ar','hi'].indexOf(lang)]||c.name||''}
function areaName(x){return x}
function setLang(x){lang=x;document.documentElement.lang=x;document.documentElement.dir=x==='ar'?'rtl':'ltr';document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===x));renderText();renderAll()}
function renderText(){txt('ticker','ticker');txt('brandSub','sub');txt('eyebrow','eyebrow');txt('heroTitle','heroTitle');txt('heroText','heroText');txt('heroProducts','products');txt('heroDelivery','delivery');txt('heroSignature','payFirstText');txt('noticeTitle','noticeTitle');txt('noticeText','noticeText');txt('payFirstTitle','payFirst');txt('payFirstText','payFirstText');txt('qDelivery','delivery');txt('qDeliveryText','qDeliveryText');txt('qDeliveryBtn','view');txt('qProducts','products');txt('qProductsText','qProductsText');txt('qProductsBtn','view');txt('qPayment','payment');txt('qPaymentText','qPaymentText');txt('qPaymentBtn','view');txt('deliveryTitle','deliveryTitle');txt('deliveryIntro','deliveryIntro');txt('stepCountry','stepCountry');txt('stepArea','stepArea');txt('countryLabel','countryLabel');txt('deliveryNotice','deliveryNotice');txt('productsTitle','productsTitle');txt('productsIntro','productsIntro');txt('productStep','productStep');txt('productCountryLabel','productCountryLabel');txt('paymentTitle','paymentTitle');txt('paymentIntro','paymentIntro');txt('paymentStep','paymentStep');txt('paymentCountryLabel','paymentCountryLabel');txt('currencyTitle','currencyTitle');txt('currencyIntro','currencyIntro');txt('fromLabel','from');txt('toLabel','to');txt('amountLabel','amount');txt('supportTitle','support');txt('footerText','footer');$('footerBrand').textContent=D.brand||'Kamrul Eagle Prime';document.title=D.brand||'Kamrul Eagle Prime'}
function fillCountrySelect(id,includeBD=true){const s=$(id);const list=includeBD?[{code:'BD',name:'Bangladesh',currency:'BDT'}].concat(D.countries||[]):(D.countries||[]);s.innerHTML=list.map(c=>`<option value="${c.code}">${countryName(c)} (${c.currency||''})</option>`).join('')}
function renderDelivery(){fillCountrySelect('countrySelect');const c=(D.countries||[]).find(x=>x.code===$('countrySelect').value);$('areas').innerHTML=(c?.areas||[]).map(a=>`<span class="area">${areaName(a)}</span>`).join('')||`<span class="area">—</span>`;$('deliveryNotice').textContent=L(D.delivery?.notice)||T[lang].deliveryNotice}
function renderProducts(){fillCountrySelect('productCountry');const code=$('productCountry').value;const cur=(D.countries||[]).find(x=>x.code===code)?.currency||'BDT';const products=D.services||[];$('productsGrid').innerHTML=products.length?products.map(p=>{let raw=p.countryPrices?.[code]??p.prices?.[code]??p.price;let val=raw!==''&&raw!=null?Number(String(raw).replace(/[^0-9.]/g,'')):null;let display=val!=null&&!isNaN(val)?money(val,cur):(p.price?String(p.price):T[lang].noProduct);return `<article class="product">${p.image?`<img loading="lazy" src="${String(p.image).replace(/"/g,'&quot;')}" alt="">`:''}<div class="product-body"><h3>${L(p.name)||L(p.title)||p.name||'Product'}</h3><p>${L(p.description)||''}</p><div class="price">${display}</div></div></article>`}).join(''):`<div class="hint">${T[lang].noProduct}</div>`}
function renderPayment(){fillCountrySelect('paymentCountry');const code=$('paymentCountry').value;const country=(D.countries||[]).find(x=>x.code===code);const box=$('paymentBox');if(code==='BD'){const active=(D.paymentAccounts||[]).filter(p=>p.active);box.innerHTML=active.length?active.map(p=>`<div class="pay-card"><h3>${L(p.method)||p.method} <span style="font-size:.75rem">• ${T[lang].active}</span></h3><div class="pay-row"><span>${T[lang].holder}</span><b>${L(p.holder)||p.holder||'—'}</b></div><div class="pay-row"><span>${T[lang].number}</span><b>${p.number||'—'} ${p.number?`<button class="copy" onclick="copyNum('${String(p.number).replace(/'/g,"\\'")}')">${T[lang].copy}</button>`:''}</b></div><div class="pay-row"><span>${T[lang].type}</span><b>${L(p.type)||p.type||'—'}</b></div></div>`).join(''): `<div class="inactive">${T[lang].noPay}</div>`}else{const banks=(D.gccBankAccounts||[]).filter(b=>b.country===country?.name||b.country===countryName(country));box.innerHTML=`<div class="inactive">${T[lang].gccWarn}</div>`+(banks.length?`<div class="bank-grid">${banks.map(b=>`<div class="bank"><b>${b.flag||'🏦'} ${L(b.bank)||b.bank}</b><div class="num">${b.account||'—'}</div><div style="margin-top:8px;color:#ff9d9d;font-weight:900">${T[lang].inactive}</div></div>`).join('')}</div>`:'')}}
function copyNum(n){navigator.clipboard?.writeText(n).then(()=>alert(T[lang].copyOk)).catch(()=>{})}
function renderCurrencies(){const opts=Object.keys(currencyData).map(k=>`<option value="${k}">${NAMES[k]?.[['bn','en','ar','hi'].indexOf(lang)]||k} (${k})</option>`).join('');['fromCurrency','toCurrency'].forEach(id=>$(id).innerHTML=opts);if(!$('fromCurrency').value)$('fromCurrency').value='SAR';if(!$('toCurrency').value)$('toCurrency').value='BDT';$('fromCurrency').value=localStorage.getItem('fromCur')||$('fromCurrency').value;$('toCurrency').value=localStorage.getItem('toCur')||$('toCurrency').value;convert()}
function convert(){const from=$('fromCurrency').value,to=$('toCurrency').value,amt=Number($('amount').value||0);const bdt=amt/(currencyData[from]||1);const out=bdt*(currencyData[to]||1);$('convertResult').textContent=money(amt,from)+' = '+money(out,to);$('convertNote').textContent='1 '+from+' ≈ '+money((1/(currencyData[from]||1))*(currencyData[to]||1),to)+' • '+T[lang].reference;localStorage.setItem('fromCur',from);localStorage.setItem('toCur',to)}
function renderAll(){renderText();renderDelivery();renderProducts();renderPayment();renderCurrencies();$('year').textContent=new Date().getFullYear();const c=D.contact||{};if(c.whatsapp){$('wa').href='https://wa.me/'+String(c.whatsapp).replace(/\D/g,'');$('wa').textContent='🟢 '+T[lang].whatsapp}else $('wa').classList.add('hidden');if(c.imo){$('imo').href=c.imo;$('imo').textContent='🔵 '+T[lang].imo}else $('imo').classList.add('hidden');if(c.messenger){$('msg').href=c.messenger;$('msg').textContent='🟣 '+T[lang].messenger}else $('msg').classList.add('hidden')}
async function load(){try{const r=await fetch('site-data.json',{cache:'no-store'});D=await r.json()}catch(e){D={brand:'Kamrul Eagle Prime',countries:[],services:[],contact:{whatsapp:'+8801625453876'}}}currencyData={...R,...(D.exchangeRates||{})};if(D.notice?.active===false){$('notice').classList.add('hidden')}renderAll()}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('countrySelect').onchange=renderDelivery;$('productCountry').onchange=renderProducts;$('paymentCountry').onchange=renderPayment;$('fromCurrency').onchange=convert;$('toCurrency').onchange=convert;$('amount').oninput=convert;$('supportBtn').onclick=()=>$('supportMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.support'))$('supportMenu').classList.remove('open')});load();
</script></body></html>
