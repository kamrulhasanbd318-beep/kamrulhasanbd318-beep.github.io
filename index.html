function renderProducts(){let ps=DATA.services||[];$('productGrid').innerHTML=ps.length?ps.map((p,i)=>{let vars=p.variations||[];return `<article class="card">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="body"><h3>${esc(p.name||tr('products'))}</h3><p>${esc(p.description||'')}</p>${vars.length?`<div class="variation"><label>${tr('chooseVariation')}</label><select id="v${i}" onchange="updatePrice(${i})">${vars.map((v,j)=>`<option value="${j}">${esc(v.name)}${v.price?' — '+formatPrice(v.price):''}</option>`).join('')}</select></div>`:''}<div class="price" id="price${i}">${formatPrice(vars[0]?.price||p.price)}</div><div class="notice">${tr('verify')}</div></div></article>`}).join(''):`<div class="notice">${tr('noProducts')}</div>`}
function updatePrice(i){let p=(DATA.services||[])[i],v=p?.variations?.[+$('v'+i).value];$('price'+i).textContent=formatPrice(v?.price||p?.price)}
function renderPayments(){let ps=(DATA.paymentAccounts||[]).filter(x=>x.active!==false&&x.number);$('paymentGrid').innerHTML=ps.length?ps.map(p=>`<div class="pay"><h3>${esc(p.method||tr('payment'))}</h3><div class="payrow"><span>${tr('name')}</span><b>${esc(p.holder||'—')}</b></div><div class="payrow"><span>${tr('number')}</span><b>${esc(p.number)}</b></div><div class="payrow"><span>${tr('type')}</span><b>${esc(p.type||'—')}</b></div><button class="copy" onclick="copyText('${esc(p.number)}')">${tr('copy')}</button></div>`).join(''):`<div class="notice">${tr('noPay')}</div>`}
function copyText(t){navigator.clipboard?.writeText(t);alert(tr('copy'))}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=DATA.brand||'Kamrul Eagle Prime';$('brandName').textContent=DATA.brand||'Kamrul Eagle Prime';$('footerBrand').textContent=DATA.brand||'Kamrul Eagle Prime';$('tickerText').textContent=tr('ticker');setText('navDelivery','delivery');setText('navProducts','products');setText('navPayment','payment');setText('navContact','contact');setText('currencyLabel','currency');setText('accountLabel','account');setText('eyebrow','eyebrow');$('heroTitle').textContent=DATA.heroTitle||tr('hero');$('heroText').textContent=DATA.heroText||tr('heroText');setText('ctaProducts','collection');setText('ctaDelivery','area');setText('heroSignature','signature');setText('noticeTitle','notice');$('noticeText').textContent=DATA.notice?.text||'';$('noticeBox').style.display=DATA.notice?.active===false?'none':'block';setText('deliveryCardTitle','deliveryCard');setText('deliveryCardText','deliveryCardText');setText('deliveryCardBtn','seeArea');setText('paymentCardTitle','paymentCard');setText('paymentCardText','paymentCardText');setText('paymentCardBtn','seePayment');setText('serviceCardTitle','serviceCard');setText('serviceCardText','serviceCardText');setText('serviceCardBtn','help');setText('deliveryTitle','deliveryTitle');setText('deliveryIntro','deliveryIntro');setText('countryLabel','country');setText('productsTitle','productsTitle');setText('productsIntro','productsIntro');setText('paymentTitle','paymentTitle');setText('contactTitle','contactTitle');setText('contactIntro','contactIntro');$('deliveryFee').textContent=DATA.delivery?.free===false?tr('charge'):tr('free');$('deliveryNotice').textContent=DATA.delivery?.notice||'';$('paymentNotice').textContent=DATA.payment?.notice||'';$('wa').textContent=tr('wa');$('imo').textContent=tr('imo');$('msg').textContent=tr('msg');$('swa').textContent=tr('wa');$('simo').textContent=tr('imo');$('smsg').textContent=tr('msg');$('sdel').textContent=tr('delivery');$('spay').textContent=tr('payment');$('footerText').textContent=tr('footer');$('year').textContent=new Date().getFullYear();renderCountries();renderProducts();renderPayments();initControls();let wa=DATA.whatsapp?('https://wa.me/'+String(DATA.whatsapp).replace(/\D/g,'')):'#contact',imo=DATA.contact?.imo||'#contact',msg=DATA.contact?.messenger||'https://www.facebook.com/messages/';['wa','swa'].forEach(id=>$(id).href=wa);['imo','simo'].forEach(id=>$(id).href=imo);['msg','smsg'].forEach(id=>$(id).href=msg)}
load();
</script></body></html>
