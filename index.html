🇦',QAR:'🇶🇦',OMR:'🇴🇲',AED:'🇦🇪',BHD:'🇧🇭',KWD:'🇰🇼',MYR:'🇲🇾'},opts=Object.keys(r).map(k=>`<option value="${k}">${flags[k]||''} ${curNames[k]||k}</option>`).join('');$('headerCurrency').innerHTML=opts;$('from').innerHTML=opts;$('to').innerHTML=opts;$('headerCurrency').value=localStorage.getItem('kep-cur')||'SAR';$('from').value='SAR';$('to').value='BDT';calc()}function calc(){const r=rates(),a=Number($('amount').value)||0,f=$('from').value,t=$('to').value;const out=(a/(r[f]||1))*(r[t]||1);$('result').textContent=money(out,t)}function wireSupport(){const c=D.contact||{};$('messenger').textContent='💬 Messenger';$('messenger').href=c.messenger||'#';$('whatsapp').textContent='🟢 WhatsApp';$('whatsapp').href='https://wa.me/'+String(c.whatsapp||'').replace(/\D/g,'')}document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('kep-lang',lang);setText()});$('headerCurrency').onchange=()=>{localStorage.setItem('kep-cur',$('headerCurrency').value);renderProducts()};$('from').onchange=calc;$('to').onchange=calc;$('amount').oninput=calc;$('supportBtn').onclick=e=>{e.stopPropagation();$('supportMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.support'))$('supportMenu').classList.remove('open')});async function load(){try{D=await (await fetch('site-data.json?'+Date.now(),{cache:'no-store'})).json();setText()}catch(e){$('heroTitle').textContent='Kamrul Eagle Prime'}}load();</script></body></html>
